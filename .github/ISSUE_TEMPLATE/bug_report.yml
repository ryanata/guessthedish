name: Bug report
description: Something in the game did not work the way it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. A short report is much better than no report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did the game do instead?
      placeholder: I selected a dish from the list and nothing was submitted.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Start a Quick Play match
        2. Type "pad" and press Enter
        3. ...
  - type: input
    id: round
    attributes:
      label: Which round or dish was on screen?
      placeholder: Round 2, the answer turned out to be Shakshuka
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari 18 on iPhone 15, or Chrome 130 on Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings, or anything else
      description: Images and short screen recordings are very welcome. Paste them straight into this box.
